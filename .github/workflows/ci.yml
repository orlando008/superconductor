name: CI

on:
  push:
  pull_request:
    # labeled/unlabeled: re-run when a maintainer adds or removes "registry-import".
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Untrusted contributions run here: read-only token, no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest
      - run: superconductor crosscheck

  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Results are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=MDRT "$BASE_SHA" HEAD -- results/submissions results/reproductions)
          if [ -n "$changed" ]; then
            echo "::error::Existing result records were modified or deleted (records are append-only):"
            echo "$changed"
            exit 1
          fi
      - name: New records name the PR author
        if: github.event_name == 'pull_request'
        shell: bash  # -eo pipefail: a failing git diff must fail the step, not pass silently
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IMPORT_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'registry-import') }}
        run: |
          if [ "$IMPORT_APPROVED" = "true" ]; then
            echo "::notice::Authorship check skipped: a maintainer applied the 'registry-import' label."
            exit 0
          fi
          git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- results/submissions results/reproductions \
            | superconductor check-authorship --author "$PR_AUTHOR"
      - name: Validate and re-run cheap submissions
        run: superconductor validate --reproduce
